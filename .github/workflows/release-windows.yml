# Build IrohChat.exe on Windows and attach it to a GitHub Release.
#
# Triggers:
#   - push a tag like v1.0.0  → build + create/update that release
#   - manual Run workflow     → build + upload artifact (no release unless a tag ref)
name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build frontend (Vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend + packager deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview

      - name: Build IrohChat.exe (PyInstaller)
        run: python -m PyInstaller --noconfirm iroh.spec

      - name: Collect artifact
        shell: pwsh
        run: |
          $exe = 'dist/IrohChat.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $item = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "size=$($item.Length)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exe release/IrohChat.exe
          @"
          # HoloChat Windows build

          - File: ``IrohChat.exe``
          - Size: $($item.Length) bytes
          - SHA256: ``$hash``
          - Commit: ``$($env:GITHUB_SHA.Substring(0,10))``
          "@ | Out-File -FilePath release/BUILD_INFO.txt -Encoding utf8
          Get-ChildItem release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IrohChat-windows
          path: |
            release/IrohChat.exe
            release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/IrohChat.exe
            release/BUILD_INFO.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
